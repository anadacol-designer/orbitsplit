# OrbitSplit — Netlify configuration

# Force HTTPS on all requests
[[redirects]]
  from = "http://orbitsplit.com/*"
  to   = "https://orbitsplit.com/:splat"
  status = 301
  force  = true

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]

    # Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Prevent your site being embedded in iframes (clickjacking protection)
    X-Frame-Options = "DENY"

    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"

    # Control what info is sent in the referrer header
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict what browser features the page can use
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Content Security Policy — controls what can load on your page
    # Allows: your own files, Google Fonts, Supabase, Jsdelivr (Supabase SDK), and unpkg (Lucide)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://maps.googleapis.com https://maps.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://zwnxjdzvoatblkinzugs.supabase.co https://maps.googleapis.com https://maps.gstatic.com https://cdn.jsdelivr.net https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://api.anthropic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com https://maps.googleapis.com https://zwnxjdzvoatblkinzugs.supabase.co; frame-ancestors 'none';"
